# ────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — PostgreSQL CI for Amazone_Clone
#
# Triggers:
#   - push to main
#   - pull_request targeting main
#
# Jobs:
#   1. Django system checks    (python manage.py check)
#   2. Migration check         (python manage.py makemigrations --check)
#   3. Test suite              (python manage.py test)
#
# Database: PostgreSQL 18 (the sole supported database).
#
# Python: 3.13 (matches production)
# Django: 6.1 (installed from requirements.txt)
# ────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: amazone_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d amazone_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: amazone_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DJANGO_SECRET_KEY: ci-insecure-key-do-not-use-in-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Migration check
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Generate and validate OpenAPI schema
        run: python manage.py spectacular --file schema.yml --validate

      - name: Upload OpenAPI schema artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: schema.yml
          if-no-files-found: warn

      - name: Run tests
        run: python manage.py test --verbosity 2
