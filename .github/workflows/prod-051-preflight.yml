# ────────────────────────────────────────────────────────────────────────
# PROD-051 — target PostgreSQL read-only runtime preflight
#
# Manual only. This workflow MUST NOT run automatically.
#
# Purpose:
#   Execute the existing PROD-050 management command against the real target
#   PostgreSQL database from the production Docker network and preserve the
#   JSON report as a workflow artifact.
#
# Safety contract:
#   - No migrations.
#   - No collectstatic.
#   - No deployment/restart of the production stack.
#   - PROD-050 itself enforces PostgreSQL transaction READ ONLY and rejects
#     mutating SQL through execute_wrapper.
#   - Production DB credentials are supplied only through GitHub Secrets.
#   - The Django SECRET_KEY used here is ephemeral and generated for the run;
#     the real production application secret is never required.
#   - The preflight container is temporary and is connected only to the
#     existing production Compose network.
#   - The production PostgreSQL service port remains unpublished to the host.
# ────────────────────────────────────────────────────────────────────────

name: PROD-051 — PostgreSQL read-only preflight

on:
  workflow_dispatch:
    inputs:
      target_label:
        description: "Non-secret target identifier written into the report artifact"
        required: true
        type: string
        default: production-postgresql
      confirm:
        description: "Type RUN to execute the read-only preflight"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prod-051-target-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: PROD-050 against target PostgreSQL
    runs-on: [self-hosted, linux, x64, production-db]
    timeout-minutes: 20

    env:
      PROD_NETWORK: amazone-clone-prod_default
      PROD051_TARGET_LABEL: ${{ inputs.target_label }}
      PROD051_DB_HOST: db
      PROD051_DB_PORT: "5432"
      PROD051_DB_NAME: ${{ secrets.PROD051_DB_NAME }}
      PROD051_DB_USER: ${{ secrets.PROD051_DB_USER }}
      PROD051_DB_PASSWORD: ${{ secrets.PROD051_DB_PASSWORD }}

    steps:
      - name: Require explicit confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.confirm }}" != "RUN" ]]; then
            echo "Refusing to run: confirmation must be exactly RUN."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker runtime and production network
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker network inspect "$PROD_NETWORK" >/dev/null
          echo "Production Docker network is available: $PROD_NETWORK"

      - name: Generate ephemeral Django secret
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print(f"DJANGO_SECRET_KEY={secrets.token_urlsafe(50)}")
          PY

      - name: Validate required target DB configuration
        shell: bash
        env:
          REQUIRED_DB_NAME: ${{ secrets.PROD051_DB_NAME }}
          REQUIRED_DB_USER: ${{ secrets.PROD051_DB_USER }}
          REQUIRED_DB_PASSWORD: ${{ secrets.PROD051_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for pair in \
            "PROD051_DB_NAME:${REQUIRED_DB_NAME}" \
            "PROD051_DB_USER:${REQUIRED_DB_USER}" \
            "PROD051_DB_PASSWORD:${REQUIRED_DB_PASSWORD}"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [[ -z "$value" ]]; then
              echo "Required GitHub secret is missing: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Build immutable PROD-051 preflight image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="prod051-preflight:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PROD051_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --file Dockerfile.backend.prod --tag "$IMAGE" .

      - name: Run PROD-050 inside production Docker network
        id: preflight
        shell: bash
        env:
          DB_NAME: ${{ secrets.PROD051_DB_NAME }}
          DB_USER: ${{ secrets.PROD051_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD051_DB_PASSWORD }}
        run: |
          set +e
          docker run --rm \
            --network "$PROD_NETWORK" \
            --env DJANGO_SETTINGS_MODULE=config.settings \
            --env DJANGO_DEBUG=False \
            --env DJANGO_ALLOWED_HOSTS=localhost \
            --env CORS_ALLOW_ALL_ORIGINS=False \
            --env CORS_ALLOWED_ORIGINS=http://localhost \
            --env DB_ENGINE=django.db.backends.postgresql \
            --env DB_HOST=db \
            --env DB_PORT=5432 \
            --env DB_NAME="$DB_NAME" \
            --env DB_USER="$DB_USER" \
            --env DB_PASSWORD="$DB_PASSWORD" \
            --env DJANGO_SECRET_KEY="$DJANGO_SECRET_KEY" \
            --env RUN_MIGRATIONS=false \
            --env RUN_COLLECTSTATIC=false \
            "$PROD051_IMAGE" \
            python manage.py prod050_preflight --format json > prod050-report.json
          status=$?
          set -e

          printf '%s\n' "PROD051_TARGET_LABEL=${PROD051_TARGET_LABEL}" > prod050-run-metadata.txt
          printf '%s\n' "GITHUB_SHA=${GITHUB_SHA}" >> prod050-run-metadata.txt
          printf '%s\n' "RUN_ID=${GITHUB_RUN_ID}" >> prod050-run-metadata.txt
          printf '%s\n' "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}" >> prod050-run-metadata.txt
          printf '%s\n' "PROD_NETWORK=${PROD_NETWORK}" >> prod050-run-metadata.txt
          printf '%s\n' "DB_HOST=db" >> prod050-run-metadata.txt
          printf '%s\n' "DB_PORT=5432" >> prod050-run-metadata.txt
          printf '%s\n' "MIGRATIONS_EXECUTED=false" >> prod050-run-metadata.txt
          printf '%s\n' "COLLECTSTATIC_EXECUTED=false" >> prod050-run-metadata.txt
          printf '%s\n' "PRECHECK_ONLY=true" >> prod050-run-metadata.txt
          printf '%s\n' "EXIT_CODE=${status}" >> prod050-run-metadata.txt

          echo "PROD-050 exit code: ${status}"
          echo "Target report saved to prod050-report.json"
          exit "${status}"

      - name: Remove temporary preflight image
        if: ${{ always() }}
        shell: bash
        run: |
          docker image rm "$PROD051_IMAGE" || true

      - name: Upload PROD-050 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prod-051-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prod050-report.json
            prod050-run-metadata.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish result summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "## PROD-051 target PostgreSQL preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`${PROD051_TARGET_LABEL}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production Docker network: \`${PROD_NETWORK}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PostgreSQL endpoint: \`db:5432\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Read-only command: \`prod050_preflight --format json\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Migrations executed: **false**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Collectstatic executed: **false**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Evidence artifact: \`prod-051-preflight-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ -f prod050-report.json ]]; then
            python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("prod050-report.json").read_text())
          print(f"Overall result: {report.get('overall_result')}")
          print(f"Audit timestamp: {report.get('audit_timestamp')}")
          print(f"Rows examined: {report.get('rows_examined')}")
          print(f"Classification counts: {report.get('classification_counts')}")
          PY
          fi
