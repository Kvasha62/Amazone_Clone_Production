# ────────────────────────────────────────────────────────────────────────
# docker/production/nginx.conf — PROD-008 / F-12 edge configuration.
#
# Единственная публичная точка входа production-стека:
#   • /healthz/         — liveness самого nginx (200 без похода в backend);
#   • /static/*         — собранные Django static-файлы (STATIC_ROOT);
#   • /media/*          — загруженные файлы (MEDIA_ROOT);
#   • всё остальное     — прокси на Gunicorn (web:8000), включая
#                         /api/v1/*, /admin/ и /api/v1/health/.
#
# Монтируется в nginx:1.27-alpine как /etc/nginx/nginx.conf (read-only).
# ────────────────────────────────────────────────────────────────────────

worker_processes auto;
# Send edge logs to the existing container stream.  The Compose json-file
# driver rotates that stream; no in-container log volume or external service
# is assumed.
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Do not use $request or $args: both can expose query-string tokens.
    # The generated Django id is available in the response header.
    log_format observability escape=json '$time_iso8601 method=$request_method path=$uri '
                             'status=$status duration_s=$request_time '
                             'request_id=$sent_http_x_request_id';
    access_log /dev/stdout observability;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Лимит тела запроса: медиа-загрузки (ImageField) + запас.
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    upstream backend {
        server web:8000;
    }

    server {
        listen 80;
        server_name _;

        # Liveness edge-проверки (docker healthcheck + внешний мониторинг).
        # Канонический URI — /healthz/ (с завершающим "/"), ровно тот, что
        # используется healthcheck'ом nginx в docker-compose.prod.yml и
        # документацией (PROD-008 architect review, BLOCKER 1).
        location = /healthz/ {
            access_log off;
            return 200 "ok\n";
        }

        # Django static (collectstatic → /app/staticfiles).
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Пользовательские медиа (MEDIA_ROOT = /app/media).
        location /media/ {
            alias /app/media/;
            expires 1d;
        }

        # Всё остальное — Django API / admin через Gunicorn.
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # The application validates these values before using them.
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Correlation-ID $http_x_correlation_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
